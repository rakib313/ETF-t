[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-trading-bot"
version = "0.1.0"
description = "Algorithmic ETF momentum rotation and swing trading bot with fractional order execution and strict risk controls."
authors = [{ name = "whoami" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

